services:

  api:
    build: ./api
    container_name: market_api
    ports:
      - "8000:8000"

  postgres:
    image: postgres:15
    container_name: market_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  etl:
    build: ./etl
    container_name: market_etl
    depends_on:
      - api
      - postgres